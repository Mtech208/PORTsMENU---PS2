# PORTMENU - NO NECESITAS EDITAR NADA DE ESTE ARCHIVO.
#
# Añadir juegos es automatico: solo copia los archivos con el MISMO nombre:
#
#   ELFS/MIJUEGO/MIJUEGO.ELF      <- el juego (o directo en ELFS/MIJUEGO.ELF)
#   ART/COV/MIJUEGO.JPG           <- cover (JPG/PNG/BMP, mismo nombre que el ELF)
#   ART/LOGO/MIJUEGO.JPG          <- logo (opcional)
#
# El menu escanea ELFS/ al arrancar y matchea los covers por nombre
# (tolerante a mayusculas/minisculas y a nombres 8.3 de la ISO).
#
# Este archivo solo existe para casos especiales: personalizar un titulo
# o anadir un ELF fuera de ELFS/ (mc0:, hdd0:). Formato:
#   titulo|ruta_elf|cover|logo||genero|anio|descripcion
#
# --- no hay entradas: todo es automatico ---
